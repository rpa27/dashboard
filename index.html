<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>출품영업팀 실적</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F6F6F4; --surface:#FFFFFF; --surface-2:#F0F0EE; --ink:#151515; --ink-2:#595959;
  --muted:#A5A5A5; --line:#E4E4E1; --line-2:#AEAEA9; --line-3:#6E6E6A; --accent:#C00000; --accent-soft:#E98181;
  --s-dae:#2C2C2C; --s-jasa:#9C9C9C; --s-chul:#C00000;
  --t-tgt:#8E8E89; --t-act:#C00000; --t-line:#151515; --t-tgt-fill:rgba(142,142,137,.30);
  --pos:#1F7A4D; --neg:#C0392B; --warn:#B26B00;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.04);
  --font:"Pretendard Variable","Pretendard",-apple-system,"IBM Plex Sans KR",system-ui,"Malgun Gothic",sans-serif;
}
:root:not([data-theme="light"]){ @media (prefers-color-scheme:dark){
  --bg:#141414; --surface:#1D1D1D; --surface-2:#262625; --ink:#F0F0EE; --ink-2:#B2B2AE;
  --muted:#6E6E6A; --line:#333331; --line-2:#4E4E4B; --line-3:#8E8E8A; --accent:#E86A6A; --accent-soft:#E98181;
  --s-dae:#D8D8D8; --s-jasa:#8C8C8A; --s-chul:#E86A6A;
  --t-tgt:#7A7A76; --t-act:#FF7B6B; --t-line:#F0F0EE; --t-tgt-fill:rgba(122,122,118,.38);
  --pos:#4FBE86; --neg:#E8776A; --warn:#E0A44A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 10px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#141414; --surface:#1D1D1D; --surface-2:#262625; --ink:#F0F0EE; --ink-2:#B2B2AE;
  --muted:#6E6E6A; --line:#333331; --line-2:#4E4E4B; --line-3:#8E8E8A; --accent:#E86A6A; --accent-soft:#E98181;
  --s-dae:#D8D8D8; --s-jasa:#8C8C8A; --s-chul:#E86A6A;
  --t-tgt:#7A7A76; --t-act:#FF7B6B; --t-line:#F0F0EE; --t-tgt-fill:rgba(122,122,118,.38);
  --pos:#4FBE86; --neg:#E8776A; --warn:#E0A44A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 10px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);
  font-feature-settings:"tnum";-webkit-font-smoothing:antialiased;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding:20px 22px 60px}
h1,h2,h3{margin:0;font-weight:700;text-wrap:balance}
.tnum{font-variant-numeric:tabular-nums}

header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;gap:2px;margin-right:auto}
.brand h1{font-size:20px;letter-spacing:-.01em}
.brand .sub{font-size:12px;color:var(--muted);letter-spacing:.02em}
.badge{font-size:10.5px;font-weight:700;color:var(--accent);border:1px solid var(--accent);
  border-radius:4px;padding:2px 6px;letter-spacing:.06em}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:3px}
.seg button{border:0;background:transparent;color:var(--ink-2);font:inherit;font-size:12.5px;font-weight:600;
  padding:5px 12px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.icon-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:8px;
  width:34px;height:34px;cursor:pointer;font-size:15px;display:grid;place-items:center}

.tabs{display:flex;gap:4px;margin:18px 0 20px}
.tabs button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:15px;font-weight:700;
  padding:8px 4px;margin-right:18px;cursor:pointer;border-bottom:2.5px solid transparent}
.tabs button[aria-pressed="true"]{color:var(--ink);border-color:var(--accent)}

.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media(max-width:1000px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:620px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 14px;box-shadow:var(--shadow)}
.kpi .k-label{font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.01em}
.kpi .k-val{font-size:23px;font-weight:700;letter-spacing:-.02em;margin-top:6px;line-height:1}
.kpi .k-unit{font-size:12px;color:var(--ink-2);font-weight:600;margin-left:2px}
.kpi .k-delta{font-size:11px;font-weight:600;margin-top:7px;display:flex;align-items:center;gap:4px}
.kpi .k-subs{margin-top:9px;padding-top:8px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:3px}
.kpi .k-sub{font-size:11px;color:var(--muted);font-weight:600}
.up{color:var(--pos)} .down{color:var(--neg)}
.meter{height:5px;border-radius:3px;background:var(--surface-2);margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px;background:var(--t-act)}
.ach{font-weight:700} .ach.ok{color:var(--pos)} .ach.mid{color:var(--warn)} .ach.bad{color:var(--neg)}

.section{margin-top:22px}
.section-h{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.section-h h2{font-size:15px}
.section-h .note{font-size:11.5px;color:var(--muted)}
.section-h .spacer{margin-left:auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.card-pad{padding:16px 18px}
.chart-box{position:relative;height:330px}
.chart-controls{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);font:inherit;font-size:12px;
  font-weight:600;padding:4px 10px;border-radius:20px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}

.src-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:720px){.src-grid{grid-template-columns:1fr}}
.src{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px 16px;box-shadow:var(--shadow);
  border-left:4px solid var(--s)}
.src h3{font-size:13.5px;display:flex;align-items:center;gap:7px}
.src .dot{width:9px;height:9px;border-radius:50%;background:var(--s)}
.src .row{display:flex;justify-content:space-between;font-size:12.5px;margin-top:9px;color:var(--ink-2)}
.src .row b{color:var(--ink);font-weight:700}

.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:11.5px;background:var(--surface)}
table:not(.xtab) th:first-child,table:not(.xtab) td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:2}
tbody tr:hover td{background:var(--surface-2)}
.pill{display:inline-block;font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:20px;border:1px solid var(--line);color:var(--ink-2)}
.controls{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.control{display:flex;flex-direction:column;gap:4px}
.control .lbl{font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.search{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 10px;font:inherit;font-size:12.5px;min-width:160px}
[hidden]{display:none!important}
.subttl{font-size:12px;color:var(--muted);margin:0 0 10px}
.xtab{border-collapse:collapse;font-size:11.5px;min-width:100%}
.xtab th,.xtab td{padding:6px 9px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
.xtab thead th{color:var(--ink-2);font-weight:600;background:var(--surface);position:sticky;top:0;z-index:3}
.xtab th.grp{text-align:center;color:var(--ink);font-weight:700;font-size:12px;border-left:2px solid var(--line);background:var(--surface-2)}
.xtab td.gsep,.xtab th.gsep{border-left:2px solid var(--line)}
.xtab th.ent,.xtab td.ent{text-align:left;position:sticky;left:0;background:var(--surface);z-index:2}
.xtab td.sum{font-weight:700;color:var(--ink)}
.xtab td.avg{color:var(--ink-2)}
.xtab td.tgt{color:var(--muted)}
.xtab tbody tr:hover td{background:var(--surface-2)}
.xtab tr.grand td{font-weight:700;border-top:2px solid var(--line);background:var(--surface-2)}
.xtab tr.grand td.ent{background:var(--surface-2)}
.xtab tr.subtot td{font-weight:700;background:var(--surface-2)}
.xtab tr.subtot td.ent{background:var(--surface-2)}
.xtab tr.mgrfirst td{border-top:2px solid var(--line-2)}
.xtab tr.spacer td{height:18px;border:0;background:var(--surface);padding:0}
.xtab tr.spacer td.ent{background:var(--surface)}
.xtab tr.gtop td{border-top:3px solid var(--line-3)}
.xtab tr.gbot td{border-bottom:3px solid var(--line-3)}
.xtab tr.gtot td{background:var(--surface-2);font-weight:700;color:var(--ink)}
.xtab tr.gtot td.ent{background:var(--surface-2);font-weight:700}
.xtab tr.gtot td.tgt{color:var(--ink-2)}
.xtab tr.gtot.main td{font-size:12.5px}
.xtab tr.gtot td.gsep{border-left:2px solid var(--line-2)}
.xtab tr.gtot td.ach.ok,.xtab tr.grand td.ach.ok{color:var(--pos)}
.xtab tr.gtot td.ach.mid,.xtab tr.grand td.ach.mid{color:var(--warn)}
.xtab tr.gtot td.ach.bad,.xtab tr.grand td.ach.bad{color:var(--neg)}
/* 담당자 이름 셀 — 클릭 가능 표시 */
.xtab td.mgr{cursor:pointer;vertical-align:middle}
.xtab td.mgr .mname{display:inline-flex;align-items:center;gap:4px;font-size:13.5px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.xtab td.mgr .chev{color:var(--accent);font-weight:700;font-size:13px;line-height:1}
.xtab td.mgr .more{display:inline-block;margin-top:4px;font-size:9.5px;font-weight:700;color:var(--accent);
  border:1px solid var(--accent);border-radius:20px;padding:1px 7px;line-height:1.45;white-space:nowrap}
.xtab td.mgr:hover{background:var(--surface-2)}
.xtab td.mgr:hover .mname{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px}
.xtab td.mgr:hover .chev{transform:translateX(2px)}
.xtab td.mgr .chev{transition:transform .12s}
.xtab td.mgr:hover .more{background:var(--accent);color:#fff}
.xtab td.mgr .tip{position:absolute;left:calc(100% + 10px);top:50%;
  transform:translateY(-50%);background:var(--ink);color:var(--bg);font-size:10.5px;font-weight:600;
  padding:5px 9px;border-radius:7px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s;z-index:30;
  box-shadow:0 2px 10px rgba(0,0,0,.18)}
.xtab td.mgr .tip::before{content:"";position:absolute;right:100%;top:50%;transform:translateY(-50%);
  border:5px solid transparent;border-right-color:var(--ink)}
.xtab td.mgr:hover .tip{opacity:1}
/* 업체별 — 한 줄짜리 변형 */
.xtab td.mgr.fm .mname{font-size:12.5px}
.xtab td.mgr.fm .more{margin-top:0;margin-left:7px;vertical-align:1px}
.xtab tr.clickrow:hover td.mgr .mname{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px}
.xtab tr.clickrow:hover td.mgr .more{background:var(--accent);color:#fff}
.xtab tr.clickrow:hover td.mgr .chev{transform:translateX(2px)}
.xtab tr.clickrow:hover td.mgr .tip{opacity:1}
.clickrow{cursor:pointer}
.clickrow:hover td{background:var(--surface-2)!important}
.periodbar{display:flex;gap:5px;flex-wrap:wrap}
.periodbar button{border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);font:inherit;
  font-size:12px;font-weight:600;padding:5px 11px;border-radius:7px;cursor:pointer}
.periodbar button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.backbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:12.5px;
  font-weight:600;padding:6px 12px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.drill-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:14px 0 6px}
.drill-head h2{font-size:19px}
.drill-meta{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.drill-meta b{color:var(--ink)}
.badge2{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;border:1px solid var(--line);color:var(--ink-2)}
.hint{font-size:11px;color:var(--muted);margin:8px 2px 0;line-height:1.7}
.lgd{display:flex;gap:14px;align-items:center;font-size:11.5px;color:var(--ink-2);margin-bottom:8px;flex-wrap:wrap}
.lgd span{display:inline-flex;align-items:center;gap:6px}
.lgd i{width:11px;height:11px;border-radius:3px;display:inline-block}
.lgd i.ln{width:16px;height:2px;border-radius:2px}
.stockhead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:14px 18px;
  background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;box-shadow:var(--shadow)}
.stockhead .lbl{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.stockhead .date{font-size:26px;font-weight:700;letter-spacing:-.02em;color:var(--ink);line-height:1}
.stockhead .src{font-size:11.5px;color:var(--muted);margin-left:auto}
.xtab td.neg{color:var(--neg);font-weight:700}
.xtab td.pos{color:var(--pos);font-weight:700}
.xtab tr.warn td{background:rgba(192,0,0,.06)}
.xtab tr.warn td.ent{background:rgba(192,0,0,.06)}
.sel{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;
  padding:7px 10px;font:inherit;font-size:12.5px;min-width:150px;cursor:pointer}
.sel:focus,.search:focus{outline:2px solid var(--accent);outline-offset:1px}
.xtab tr.sel-row td{background:var(--surface-2)}
.xtab tr.clk td{cursor:pointer}
.xtab tr.clk:hover td{background:var(--surface-2)}
/* 고정 열(업체명·담당자) — 가로 스크롤 시 겹침 방지 */
.xtab thead th.ent{z-index:6}
.xtab td.ent,.xtab th.ent{box-shadow:inset -1px 0 0 var(--line)}
.xtab tr.warn td.ent{background:linear-gradient(rgba(192,0,0,.06),rgba(192,0,0,.06)),var(--surface)}
.xtab tr.warn:hover td.ent,.xtab tr.clk:hover td.ent,.xtab tr.clickrow:hover td.ent,.xtab tbody tr:hover td.ent{background:var(--surface-2)}
.xtab tr.sel-row td.ent{background:var(--surface-2)}
.xtab td.mgr .tip{display:none}
@media(max-width:620px){
  .xtab td.mgr.fm{white-space:nowrap}
  .xtab td.mgr.fm .mname{display:inline-block;max-width:118px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle;font-size:12px}
  .xtab td.mgr.fm .chev{display:none}
  .xtab td.mgr.fm .more{margin-left:4px;font-size:9px;padding:0 5px}
}
.lockbox{max-width:380px;margin:40px auto;text-align:center;padding:30px 24px}
.lockbox .lock-ico{font-size:26px;margin-bottom:8px}
.lockbox h2{font-size:17px;margin-bottom:6px}
.lockbox p{font-size:12.5px;color:var(--muted);margin:0 0 14px}
.lock-row{display:flex;gap:8px;justify-content:center}
.lock-row .search{min-width:0;width:170px;text-align:center;letter-spacing:.2em}
.lockbox .lock-err{color:var(--neg);font-weight:600;margin:10px 0 0;min-height:1em}
</style>

<div class="wrap">
  <header>
    <div class="brand">
      <h1>출품영업팀 대시보드</h1>
      <span class="sub">코오롱오토옥션 · 전 항목 공급가(VAT 별도)</span>
    </div>
    <span class="badge">대외비</span>
    <div class="seg" id="yearSeg" role="group" aria-label="연도">
      <button data-year="2025" aria-pressed="false">2025</button>
      <button data-year="2026" aria-pressed="true">2026</button>
    </div>
    <button class="icon-btn" id="themeBtn" title="테마 전환" aria-label="테마 전환">◐</button>
  </header>

  <nav class="tabs" role="tablist">
    <button data-tab="home" aria-pressed="true">요약</button>
    <button data-tab="analysis" aria-pressed="false">상세</button>
    <button data-tab="weekly" aria-pressed="false">주간업무일지</button>
    <button data-tab="stock" aria-pressed="false">매입대행 재고현황</button>
    <button data-tab="shops" aria-pressed="false">출품전문점 현황</button>
  </nav>

  <section id="tab-home">
    <div class="kpis" id="kpis"></div>
    <div id="kpiNote" style="margin:8px 2px 0;font-size:11.5px;color:var(--muted)"></div>

    <div class="section">
      <div class="section-h"><h2>월별 목표 · 실적</h2><span class="note" id="trendNote"></span></div>
      <div class="card card-pad">
        <div class="chart-controls" id="trendChips"></div>
        <div class="lgd" id="trendLgd"></div>
        <div class="chart-box"><canvas id="trendChart"></canvas></div>
      </div>
    </div>

    <div class="section">
      <div class="section-h">
        <h2 id="perfTitle">월별 목표 · 실적 · 달성률</h2>
        <span class="note">출품영업팀 전체 · 공급가</span>
        <span class="spacer"></span>
        <div class="seg" id="modeSeg" role="group" aria-label="집계 단위">
          <button data-mode="month" aria-pressed="true">합계</button>
          <button data-mode="week" aria-pressed="false">주당 평균</button>
        </div>
      </div>
      <div class="card"><div class="tbl-wrap"><table class="xtab" id="perfTable"><thead></thead><tbody></tbody></table></div></div>
      <p class="hint" id="perfHint"></p>
    </div>

    <div class="section">
      <div class="section-h"><h2>소스별 실적</h2><span class="note" id="srcNote"></span></div>
      <div class="src-grid" id="srcGrid"></div>
    </div>
  </section>

  <section id="tab-analysis" hidden>
    <div id="detailMain">
      <div class="controls">
        <div class="control"><span class="lbl">디멘션</span>
          <div class="seg" id="dimSeg" role="group">
            <button data-dim="source" aria-pressed="false">소스별</button>
            <button data-dim="manager" aria-pressed="true">담당자별</button>
            <button data-dim="firm" aria-pressed="false">업체별</button>
          </div>
        </div>
        <div class="control"><span class="lbl">기간</span>
          <div class="periodbar" id="periodBar"></div>
        </div>
        <div class="control" id="viewWrap"><span class="lbl">보기</span>
          <div class="seg" id="viewSeg" role="group">
            <button data-view="tgt" aria-pressed="true">목표 대비</button>
            <button data-view="per" aria-pressed="false">기간별</button>
          </div>
        </div>
        <div class="control" id="searchWrap" hidden><span class="lbl">업체 검색</span>
          <input class="search" id="firmSearch" placeholder="업체명…" autocomplete="off">
        </div>
      </div>
      <div id="detailBody"></div>
      <p class="hint" id="detailHint"></p>
    </div>
    <div id="drillView" hidden></div>
  </section>

  <section id="tab-weekly" hidden>

<script>
(function(){
"use strict";
const MONTHS=[...Array(12)].map((_,i)=>(i+1)+"월");
const SRC=[["대행","출품전문점 출품대행","--s-dae"],["자사유도","출품전문점 자사+유도","--s-jasa"],["출품사","출품사(경공매)","--s-chul"]];
const TEAM=(DASH.targets&&DASH.targets.order)||["이윤행","오진식","조영일","김형동","박기림","김원석"];
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

let YEAR="2026", TAB="home", DIM="manager", TRENDM="out", SUMMODE="month", MVIEW="tgt";
let firmQ="", MON="all";
let trendChart, drillChart;

/* ---------- 기본 집계 ---------- */
const E=()=>({out:0,new:0,won:0,bid:0,f_out:0,f_deal:0,f_won:0,f_tot:0});
function totalRow(year,src,months){const M=DASH[year].monthly[src];const o=E();
  months.forEach(m=>{const d=M[m];if(d)for(const k in o)o[k]+=(d[k]||0);});return o;}
function allSrcTotal(year,months){const o=E();
  SRC.forEach(([s])=>{const r=totalRow(year,s,months);for(const k in o)o[k]+=r[k];});return o;}
const dataMonths=year=>MONTHS.filter(m=>allSrcTotal(year,[m]).out>0);
const wPlan=(y,m)=>(DASH[y].weeks&&DASH[y].weeks[m])||0;
const wAct =(y,m)=>(DASH[y].wact&&DASH[y].wact[m])!=null?DASH[y].wact[m]:wPlan(y,m);
const sumPlan=(y,ms)=>ms.reduce((a,m)=>a+wPlan(y,m),0);
const sumAct =(y,ms)=>ms.reduce((a,m)=>a+wAct(y,m),0);

const fInt=n=>Math.round(n).toLocaleString("ko-KR");
const f1=n=>(Math.round(n*10)/10).toLocaleString("ko-KR",{minimumFractionDigits:1,maximumFractionDigits:1});
const fPct=x=>(x*100).toFixed(1)+"%";
const fEok=n=>(n/1e8).toFixed(2)+"억";
const fMil1=v=>(v/1e6).toFixed(1);
const fMil=n=>Math.round(n/1e6).toLocaleString("ko-KR");
const rate=d=>d.out?d.won/d.out:0;
const perWonFee=d=>d.won?d.f_tot/d.won:0;
const perWonBid=d=>d.won?d.bid/d.won:0;
const dash=()=>'<span style="color:var(--muted)">–</span>';


/* 정수 배분 — 반올림 후에도 부분 합계가 총계와 정확히 일치하도록(최대 잔여법).
   대수(출품·낙찰·신규)는 원래 정수라 목표만 소수인데, 그 목표를 쪼갤 때 쓴다. */
function allocInt(raws,total){
  const n=raws.length; if(!n)return [];
  const base=raws.map(v=>Math.floor(v||0));
  let rem=Math.round(total)-base.reduce((a,b)=>a+b,0);
  const order=raws.map((v,i)=>[(v||0)-Math.floor(v||0),i]).sort((a,b)=>b[0]-a[0]);
  const out=base.slice();
  const step=rem>=0?1:-1;
  for(let k=0;k<Math.abs(rem);k++) out[order[k%n][1]]+=step;
  return out;
}
const IK=["out","won","new"];   // 정수 지표

/* ---------- 목표 ---------- */
const hasTG=y=>y==="2026"&&!!DASH.targets;
const TGT=(y,path,months)=>{ // path: ['team'] | ['teamSeg',seg] | ['mgr',name,seg]
  if(!hasTG(y))return null;
  let node=DASH.targets;
  for(const p of path){node=node&&node[p];}
  if(!node)return null;
  const o={out:0,won:0,new:0,f_tot:0};
  months.forEach(m=>{const d=node[m];if(d){o.out+=d.out;o.won+=d.won;o.new+=d.new;o.f_tot+=d.f_tot;}});
  o.rate=o.out?o.won/o.out:0;
  return o;
};
const achCls=r=>r>=1?"ok":r>=0.9?"mid":"bad";
function achCell(a,t,extra){ // 달성률 셀
  if(t==null||!t) return `<td class="${extra||''}">${dash()}</td>`;
  const r=a/t; return `<td class="${extra||''} tnum ach ${achCls(r)}">${(r*100).toFixed(1)}%</td>`;}
function achTxt(a,t){if(!t)return dash();const r=a/t;return `<span class="ach ${achCls(r)}">${(r*100).toFixed(1)}%</span>`;}

/* ---------- KPI ---------- */
const KMET=[["out","출품대수","대","int"],["won","낙찰대수","대","int"],["rate","낙찰률","","pct"],
            ["new","신규출품","대","int"],["f_tot","수수료합계","","eok"]];
const fmtV=(v,t)=>t==="int"?fInt(v):t==="pct"?fPct(v):t==="eok"?fEok(v):fInt(v);
function renderKPI(){
  const ms=dataMonths(YEAR), cur=allSrcTotal(YEAR,ms);
  cur.rate=rate(cur);
  const tg=TGT(YEAR,["team"],ms);
  const wa=sumAct(YEAR,ms)||1, wp=sumPlan(YEAR,ms)||1;
  const other=YEAR==="2026"?"2025":"2026", prevMs=dataMonths(other), prev=allSrcTotal(other,prevMs);
  prev.rate=rate(prev);
  const pwa=sumAct(other,prevMs)||1;
  $("#kpis").innerHTML=KMET.map(([k,label,unit,t])=>{
    const v=cur[k], tv=tg?tg[k]:null;
    const isRate=k==="rate";
    const aw=isRate?v:v/wa, tw=tv==null?null:(isRate?tv:tv/wp), pw=isRate?prev[k]:prev[k]/pwa;
    let meter="", ach="";
    if(tv!=null){
      const r=isRate?(v/tv):(v/tv);
      ach=`<div class="k-delta"><span class="ach ${achCls(r)}">달성 ${(r*100).toFixed(1)}%</span>
        <span style="color:var(--muted)">목표 ${fmtV(tv,t)}</span></div>`;
      meter=`<div class="meter"><i style="width:${Math.min(100,Math.max(0,r*100)).toFixed(1)}%"></i></div>`;
    }else{
      const d=prev[k]?(v-prev[k])/prev[k]:null;
      ach=d==null?`<div class="k-delta" style="color:var(--muted)">—</div>`
        :`<div class="k-delta ${d>=0?'up':'down'}">${d>=0?'▲':'▼'} ${Math.abs(d*100).toFixed(1)}% <span style="color:var(--muted)">vs ${other}</span></div>`;
    }
    const subs=[`주당 실적 <b style="color:var(--ink)">${fmtV(aw,t)}</b>`]
      .concat(tw!=null?[`주당 목표 <b style="color:var(--ink)">${fmtV(tw,t)}</b> · ${achTxt(aw,tw)}`]:[])
      .concat([`${other} 주당 <b style="color:var(--ink)">${fmtV(pw,t)}</b>`]);
    return `<div class="kpi"><div class="k-label">${label}</div>
      <div class="k-val tnum">${fmtV(v,t)}<span class="k-unit">${unit}</span></div>${ach}${meter}
      <div class="k-subs">${subs.map(s=>`<div class="k-sub">${s}</div>`).join("")}</div></div>`;
  }).join("");
  const last=ms[ms.length-1];
  $("#kpiNote").innerHTML = hasTG(YEAR)
    ? `연 누적 = ${ms[0]}~${last} · 달성률은 <b>해당 기간 목표 누계</b> 대비. ${last}는 ${wAct(YEAR,last)}/${wPlan(YEAR,last)}주 진행 → 월 달성률은 낮게 보이므로 <b>주당 실적 vs 주당 목표</b>를 함께 보세요.`
    : `${YEAR}년은 목표 데이터 없음 — 전년 대비만 표기.`;
}

/* ---------- 차트 : 목표/실적 막대 + 실적 꺾은선 + 달성률 라벨 ---------- */
const METRICS={out:"출품대수",won:"낙찰대수",rate:"낙찰률",new:"신규대수",f_tot:"수수료합계"};
function renderTrendChips(){$("#trendChips").innerHTML=Object.entries(METRICS).map(([k,v])=>
  `<button class="chip" data-m="${k}" aria-pressed="${k===TRENDM}">${v}</button>`).join("");}
const achPlugin={id:"achLbl",afterDatasetsDraw(chart,args,opts){
  const arr=(opts&&opts.values)||chart.$ach; if(!arr)return;
  const ctx=chart.ctx, meta0=chart.getDatasetMeta(0), meta1=chart.getDatasetMeta(1);
  ctx.save(); ctx.font="700 10.5px "+cssv("--font").split(",")[0].replace(/"/g,"");
  ctx.textAlign="center"; ctx.textBaseline="bottom";
  arr.forEach((r,i)=>{ if(r==null)return;
    const b0=meta0.data[i], b1=meta1&&meta1.data[i]; if(!b0)return;
    const x=b1?(b0.x+b1.x)/2:b0.x;
    const y=Math.min(b0.y,b1?b1.y:b0.y)-5;
    ctx.fillStyle=r>=1?cssv("--pos"):r>=0.9?cssv("--warn"):cssv("--neg");
    ctx.fillText((r*100).toFixed(0)+"%",x,y);});
  ctx.restore();}};
function renderTrend(){
  if(typeof Chart==="undefined")return;
  const isRate=TRENDM==="rate", isMoney=TRENDM==="f_tot";
  const fmtY=isRate?(v=>(v*100).toFixed(0)+"%"):isMoney?(v=>fMil(v)):(v=>fInt(v));
  const fmtT=isRate?fPct:isMoney?fEok:fInt;
  const tg=cssv("--t-tgt"), ac=cssv("--t-act"), ln=cssv("--t-line"), ink=cssv("--ink"), muted=cssv("--muted"), line=cssv("--line");
  const act=MONTHS.map(m=>{const d=allSrcTotal(YEAR,[m]);return d.out===0?null:(isRate?rate(d):d[TRENDM]);});
  const tgt=MONTHS.map(m=>{const t=TGT(YEAR,["team"],[m]);return t?t[TRENDM]:null;});
  const ach=MONTHS.map((m,i)=>(act[i]!=null&&tgt[i])?act[i]/tgt[i]:null);
  const ds=[];
  if(hasTG(YEAR)) ds.push({type:"bar",label:"목표",data:tgt,backgroundColor:cssv("--t-tgt-fill"),
    borderColor:tg,borderWidth:1.5,borderRadius:4,borderSkipped:"bottom",order:1});
  ds.push({type:"bar",label:"실적",data:act,backgroundColor:ac,borderRadius:4,borderSkipped:"bottom",order:2});
  ds.push({type:"line",label:"실적 추이",data:act,borderColor:ln,backgroundColor:ln,borderWidth:2,
    tension:.3,pointRadius:4,pointHoverRadius:7,spanGaps:false,order:3,
    pointBackgroundColor:cssv("--surface"),pointBorderColor:ln,pointBorderWidth:2});
  if(trendChart)trendChart.destroy();
  trendChart=new Chart($("#trendChart"),{data:{labels:MONTHS,datasets:ds},plugins:[achPlugin],
    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:"index",intersect:false},
      layout:{padding:{top:18}},
      plugins:{legend:{display:false},achLbl:{values:ach},
        tooltip:{callbacks:{label:c=>` ${c.dataset.label}: ${fmtT(c.parsed.y)}`,

}

/* ---------- 요약 표 ---------- */
const PG=[["out","출품","int"],["won","낙찰","int"],["rate","낙찰률","pct"],["new","신규출품","int"],["f_tot","수수료","eok"]];
function renderPerf(){
  const week=SUMMODE==="week", y=YEAR, ms=dataMonths(y);
  $("#perfTitle").textContent=week?"월별 목표 · 실적 (주당 평균)":"월별 목표 · 실적 · 달성률";
  let h1=`<th class="ent" rowspan="2">월</th><th rowspan="2">주차<br>실시/계획</th>`, h2="";
  PG.forEach(g=>{const n=g[0]==="rate"?2:3;
    h1+=`<th class="grp gsep" colspan="${n}">${g[1]}${g[2]==="eok"?" (억)":""}</th>`;
    h2+=`<th class="gsep">목표</th><th>실적</th>`+(g[0]==="rate"?"":`<th>달성률</th>`);});
  h1+=`<th class="grp gsep" colspan="4">참고</th>`;
  h2+=`<th class="gsep">대당수수료</th><th>대당낙찰가</th><th>매출액</th><th>매출이익</th>`;
  const cells=(a,t,divA,divP)=>{let s="";
    PG.forEach(g=>{const k=g[0], isR=k==="rate";
      const av=isR?rate(a):a[k]/divA, tv=t==null?null:(isR?t.rate:t[k]/divP);
      const f=v=>g[2]==="pct"?fPct(v):g[2]==="eok"?(v/1e8).toFixed(3):(g[0]==="rate"?fPct(v):fInt(v));
      s+=`<td class="gsep tnum tgt">${tv==null?dash():f(tv)}</td><td class="tnum sum">${f(av)}</td>`;
      if(!isR)s+=achCell(a[k],t?t[k]:null);});
    return s;};
  const totT0=TGT(y,["team"],ms);
  const IM={}; ms.forEach(m=>IM[m]={});
  if(totT0){IK.forEach(k=>{
    const am=allocInt(ms.map(m=>{const t=TGT(y,["team"],[m]);return t?t[k]:0;}),totT0[k]);
    ms.forEach((m,i)=>IM[m][k]=am[i]);});}
  const rows=ms.map(m=>{
    const a=allSrcTotal(y,[m]), t0=TGT(y,["team"],[m]), t=t0?Object.assign({},t0,IM[m]):null;
    const wa=wAct(y,m)||1, wp=wPlan(y,m)||1;
    const R=(DASH[y].rev||{})[m];
    const partial=wa<wp;
    return `<tr><td class="ent">${m}${partial?' <span class="pill" style="color:var(--warn);border-color:var(--warn)">진행중</span>':''}</td>`
      +`<td class="tnum">${wa}/${wp}</td>`
      +cells(a,t,week?wa:1,week?wp:1)
      +`<td class="gsep tnum">${fInt(perWonFee(a))}</td><td class="tnum">${fInt(perWonBid(a))}</td>`
      +`<td class="tnum">${R?fEok(R.rev/(week?wa:1)):dash()}</td><td class="tnum">${R?fEok(R.prof/(week?wa:1)):dash()}</td></tr>`;
  }).join("");
  const A=allSrcTotal(y,ms), T0=TGT(y,["team"],ms);
  const T=T0?Object.assign({},T0,{out:ms.reduce((a,m)=>a+(IM[m].out||0),0),won:ms.reduce((a,m)=>a+(IM[m].won||0),0),new:ms.reduce((a,m)=>a+(IM[m].new||0),0)}):null;
  const wa=sumAct(y,ms)||1, wp=sumPlan(y,ms)||1;
  const REV=DASH[y].rev||{}, rv=ms.reduce((o,m)=>{const R=REV[m];if(R){o.r+=R.rev;o.p+=R.prof;o.n++;}return o;},{r:0,p:0,n:0});
  const ncolP=2+PG.reduce((a,g)=>a+(g[0]==="rate"?2:3),0)+4;
  const spacerP=`<tr class="spacer"><td class="ent"></td><td colspan="${ncolP-1}"></td></tr>`;
  const tot=`<tr class="gtot main gtop"><td class="ent">${ms[0]}~${ms[ms.length-1]} 누계</td><td class="tnum">${wa}/${wp}</td>`
    +cells(A,T,week?wa:1,week?wp:1)
    +`<td class="gsep tnum">${fInt(perWonFee(A))}</td><td class="tnum">${fInt(perWonBid(A))}</td>`
    +`<td class="tnum">${rv.n?fEok(rv.r/(week?wa:1)):dash()}</td><td class="tnum">${rv.n?fEok(rv.p/(week?wa:1)):dash()}</td></tr>`;
  // 연간 목표 행
  let yr="";
  if(hasTG(y)){const YT=TGT(y,["team"],MONTHS); const ywp=sumPlan(y,MONTHS);
    yr=`<tr class="gtot gbot"><td class="ent">연간 목표</td><td class="tnum">–/${ywp}</td>`
      +PG.map(g=>{const k=g[0],isR=k==="rate";
        const tv=isR?YT.rate:YT[k]/(week?ywp:1);
        const f=v=>g[2]==="pct"?fPct(v):g[2]==="eok"?(v/1e8).toFixed(3):fInt(v);
        return `<td class="gsep tnum">${f(tv)}</td><td class="tnum">${dash()}</td>`+(isR?"":achCell(A[k],YT[k]));}).join("")
      +`<td class="gsep">${dash()}</td><td>${dash()}</td><td>${dash()}</td><td>${dash()}</td></tr>`;}
  $("#perfTable thead").innerHTML=`<tr>${h1}</tr><tr>${h2}</tr>`;
  $("#perfTable tbody").innerHTML=rows+spacerP+tot+yr;
  $("#perfHint").innerHTML= week
    ? `주당 평균 = <b>실적 ÷ 실시 주차</b>, <b>목표 ÷ 계획 주차</b>. 달성률은 합계 기준(진척율)이 아니라 주당 기준 비교값입니다.`
    : `달성률 = 실적 ÷ 목표. 진행중인 달은 주차가 덜 채워져 달성률이 낮게 보입니다 — 「주당 평균」으로 전환해 비교하세요. "연간 목표" 행의 달성률은 연간 목표 대비 현재 누계입니다.`;
}

/* ---------- 상세 ---------- */
const DET=y=>DASH.detail[y];
const nrm=s=>(s||"").replace(/\(.*?\)/g,"").replace(/（.*?）/g,"").replace(/주식회사|\(주\)|㈜|주\)|\(신\)/g,"").replace(/\s+/g,"").trim();
const dmonths=y=>MONTHS.filter(m=>(DET(y).nweeks[m]||0)>0);
const eW=()=>({out:0,new:0,won:0,bid:0,f_tot:0});
const aW=(a,b)=>({out:a.out+b.out,new:a.new+b.new,won:a.won+b.won,bid:a.bid+b.bid,f_tot:a.f_tot+b.f_tot});
const sW=arr=>(arr||[]).reduce(aW,eW());
const mv=(o,k)=>k==="rate"?(o.out?o.won/o.out:0):k==="pwf"?(o.won?o.f_tot/o.won:0):k==="pwb"?(o.won?o.bid/o.won:0):o[k];
const fmtG=(v,t)=>t==="int"?fInt(v):t==="pct"?fPct(v):t==="mil1"?fMil1(v):t==="eok"?fEok(v):t==="won"?fInt(v):v;
const srcWM=(y,s)=>m=>(DET(y).srcW[s]&&DET(y).srcW[s][m])||[];
const mgrSeg=(y,mg,seg)=>m=>((DET(y).mgrW[mg]||{})[seg]||{})[m]||[];
const mgrAll=(y,mg)=>m=>{const a=mgrSeg(y,mg,"전문점")(m),b=mgrSeg(y,mg,"출품사")(m);
  const n=Math.max(a.length,b.length),o=[];for(let i=0;i<n;i++)o.push(aW(a[i]||eW(),b[i]||eW()));return o;};
const selMonths=y=>MON==="all"?dmonths(y):[MON];

function renderPeriodBar(){
  const md=dmonths(YEAR); if(MON!=="all"&&!md.includes(MON))MON="all";
  $("#periodBar").innerHTML=["all",...md].map(m=>`<button data-p="${m}" aria-pressed="${m===MON}">${m==="all"?"전체":m}</button>`).join("");
}

/* --- 담당자별 : 목표 대비 (REPORT 형식) --- */
const MG=[["out","출품","int"],["won","낙찰","int"],["rate","낙찰률","pct"],["new","신규출품","int"],["f_tot","수수료(백만)","mil1"]];
function renderMgrTarget(){
  const y=YEAR, ms=selMonths(y);
  const wa=sumAct(y,ms)||1, wp=sumPlan(y,ms)||1;
  // ── 목표 정수화 : 팀 총계 → 담당자 → 전문점/출품사 순으로 내려가며 배분해
  //    반올림 후에도 「전문점+출품사=합계」, 「6인합=총합계」가 정확히 맞게 한다.
  const rawSeg={}, rawTot={}, iSeg={}, iTot={};
  TEAM.forEach(n=>{
    rawSeg[n]={전문점:TGT(y,["mgr",n,"전문점"],ms),출품사:TGT(y,["mgr",n,"출품사"],ms)};
    rawTot[n]=TGT(y,["mgr",n,"합계"],ms);
    iSeg[n]={전문점:{},출품사:{}}; iTot[n]={};
  });
  const teamT=TGT(y,["team"],ms);
  if(teamT){
    IK.forEach(k=>{
      const per=allocInt(TEAM.map(n=>rawTot[n][k]),teamT[k]);
      TEAM.forEach((n,i)=>{
        iTot[n][k]=per[i];
        const two=allocInt([rawSeg[n]["전문점"][k],rawSeg[n]["출품사"][k]],per[i]);
        iSeg[n]["전문점"][k]=two[0]; iSeg[n]["출품사"][k]=two[1];
      });
    });
  }
  const mkT=(raw,ints)=>raw?Object.assign({},raw,ints):null;
  let h1=`<th class="ent" rowspan="2">담당자</th><th rowspan="2">구분</th><th rowspan="2">담당<br>업체수</th>`, h2="";
  MG.forEach(g=>{const isR=g[0]==="rate";
    h1+=`<th class="grp gsep" colspan="${isR?2:5}">${g[1]}</th>`;
    h2+=isR?`<th class="gsep">목표</th><th>실적</th>`
      :`<th class="gsep">목표</th><th>주평균<br>목표</th><th>실적</th><th>주평균<br>실적</th><th>달성률</th>`;});
  const rowCells=(a,t)=>{let s="";
    MG.forEach(g=>{const k=g[0], isR=k==="rate";
      const f=v=>g[2]==="pct"?fPct(v):g[2]==="mil1"?fMil1(v):fInt(v);
      if(isR){s+=`<td class="gsep tnum tgt">${t&&t.out?fPct(t.won/t.out):dash()}</td><td class="tnum sum">${fPct(mv(a,"rate"))}</td>`;return;}
      s+=`<td class="gsep tnum tgt">${t?f(t[k]):dash()}</td><td class="tnum tgt">${t?f(t[k]/wp):dash()}</td>`
        +`<td class="tnum sum">${f(a[k])}</td><td class="tnum avg">${f(a[k]/wa)}</td>`;
      s+=achCell(a[k],t?t[k]:null);});
    return s;};
  let body="";
  const GT={전문점:eW(),출품사:eW(),합계:eW()};
  const GG={전문점:null,출품사:null,합계:null};
  const GC={전문점:0,출품사:0};
  const addT=(o,t)=>{if(!t)return o;if(!o)return{out:t.out,won:t.won,new:t.new,f_tot:t.f_tot};
    return {out:o.out+t.out,won:o.won+t.won,new:o.new+t.new,f_tot:o.f_tot+t.f_tot};};
  TEAM.forEach(n=>{
    const cnt=DET(y).mgrCnt[n]||{전문점:0,출품사:0};
    const segs=[["전문점",cnt.전문점],["출품사",cnt.출품사]];
    let sumA=eW(), sumT=null;
    segs.forEach(([seg,c],i)=>{
      const a=sW(ms.map(m=>sW(mgrSeg(y,n,seg)(m))));
      const t=mkT(rawSeg[n][seg],iSeg[n][seg]);
      sumA=aW(sumA,a); sumT=addT(sumT,t);
      GT[seg]=aW(GT[seg],a); GG[seg]=addT(GG[seg],t); GC[seg]+=c;
      body+=`<tr class="${i===0?'mgrfirst':''}">`
        +(i===0?`<td class="ent mgr" rowspan="3" data-drill="manager" data-key="${encodeURIComponent(n)}">`
           +`<span class="mname">${n}<span class="chev">\u203A</span></span><br><span class="more">상세 보기</span>`
           +`<span class="tip">클릭 → 월별 목표·실적 상세</span></td>`:"")
        +`<td>${seg}</td><td class="tnum">${c}</td>${rowCells(a,t)}</tr>`;});
    GT.합계=aW(GT.합계,sumA); GG.합계=addT(GG.합계,sumT);
    body+=`<tr class="subtot clickrow" data-drill="manager" data-key="${encodeURIComponent(n)}">`
      +`<td>합계</td><td class="tnum">${cnt.전문점+cnt.출품사}</td>${rowCells(sumA,sumT)}</tr>`;});
  const ncol=3+MG.reduce((a,g)=>a+(g[0]==="rate"?2:5),0);
  const spacer=`<tr class="spacer"><td class="ent"></td><td colspan="${ncol-1}"></td></tr>`;
  const gcnt={전문점:GC.전문점,출품사:GC.출품사,합계:GC.전문점+GC.출품사};
  const grand=["전문점","출품사","합계"].map((seg,i)=>
    `<tr class="gtot${seg==='합계'?' main gbot':''}${i===0?' gtop':''}">`
    +(i===0?`<td class="ent" rowspan="3">총합계</td>`:"")
    +`<td>${seg}</td><td class="tnum">${gcnt[seg]}</td>${rowCells(GT[seg],GG[seg])}</tr>`).join("");
  $("#detailBody").innerHTML=`<div class="card"><div class="tbl-wrap"><table class="xtab">
    <thead><tr>${h1}</tr><tr>${h2}</tr></thead><tbody>${body}${spacer}${grand}</tbody></table></div></div>`;
  const teamA=allSrcTotal(y,ms);
  const gap=teamA.out-GT.합계.out;
  $("#detailHint").innerHTML=`기간 ${MON==="all"?ms[0]+"~"+ms[ms.length-1]:MON} · 실시 ${wa}주 / 계획 ${wp}주 · `
    +`대수는 정수(실적=건수, 목표=배분값 반올림) · 주평균 목표 = 목표÷계획주차, 주평균 실적 = 실적÷실시주차 · 달성률 = 실적÷목표`
    +(gap?` · <b style="color:var(--warn)">담당자 미매핑 ${gap}대</b>(팀 합계 ${fInt(teamA.out)}대 = 총합계 ${fInt(GT.합계.out)} + ${gap})`:"")
    +` · <b style="color:var(--accent)">담당자 이름</b> 또는 합계 행을 클릭하면 월별 목표·실적 상세가 열립니다`;
  bindDrill();
}
/* --- 기간별 크로스 (소스별 / 담당자별 공용) --- */
function renderCross(){
  const y=YEAR, isMgr=DIM==="manager";

    ? TEAM.map(mg=>({name:mg,cnt:DET(y).mgrCnt[mg]||{전문점:0,출품사:0},cols:cs.get(mgrAll(y,mg)),drill:mg}))

  const rowCells=cols=>{const tot=sW(cols);let s="";
    MG.forEach(g=>{const k=g[0];

  const body=ents.map(e=>{const cnt=isMgr?`<td class="gsep tnum">${e.cnt.전문점}/${e.cnt.출품사}</td>`:``;
    const d=e.drill?`clickrow" data-drill="manager" data-key="${encodeURIComponent(e.drill)}`:'';
    const nm=e.drill?`<td class="ent mgr"><span class="mname">${e.name}<span class="chev">\u203A</span></span><span class="tip">클릭 → ${e.name} 상세</span></td>`

  const ncol2=1+(isMgr?1:0)+MG.length*(nc+2);
  const spacer=`<tr class="spacer"><td class="ent"></td><td colspan="${ncol2-1}"></td></tr>`;
  const grand=`<tr class="gtot main gtop gbot"><td class="ent">총합계</td>${isMgr?'<td class="gsep"></td>':''}${rowCells(grandCols)}</tr>`;

const b64u=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
async function unlockShops(pw){
  const E=DASH.shopsEnc; if(!E||!(window.crypto&&crypto.subtle))throw new Error("no crypto");
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64u(E.salt),iterations:E.it,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64u(E.iv)},key,b64u(E.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

function drillManager(name){

  const cols=[["out","출품","int"],["won","낙찰","int"],["rate","낙찰률","pct"],["new","신규","int"],["f_tot","수수료(백만)","mil1"]];
  // 목표 정수화 : 기간 총계 → 월 → 전문점/출품사 순으로 배분(합이 항상 맞게)
  const ITG={합계:{},전문점:{},출품사:{}};
  ms.forEach(m=>{["합계","전문점","출품사"].forEach(sg=>ITG[sg][m]={});});
  (function(){
    const per=TGT(y,["mgr",name,"합계"],ms); if(!per)return;
    IK.forEach(k=>{
      const rawM=ms.map(m=>{const t=TGT(y,["mgr",name,"합계"],[m]);return t?t[k]:0;});
      const am=allocInt(rawM,per[k]);
      ms.forEach((m,i)=>{
        ITG["합계"][m][k]=am[i];
        const tj=TGT(y,["mgr",name,"전문점"],[m]), tc=TGT(y,["mgr",name,"출품사"],[m]);
        const two=allocInt([tj?tj[k]:0,tc?tc[k]:0],am[i]);
        ITG["전문점"][m][k]=two[0]; ITG["출품사"][m][k]=two[1];
      });
    });
  })();
  const segTable=(title,seg)=>{
    const rows=ms.map(m=>{const raw=TGT(y,seg==="합계"?["mgr",name,"합계"]:["mgr",name,seg],[m]);
      return {m,o:sW(seg==="합계"?mgrAll(y,name)(m):mgrSeg(y,name,seg)(m)),
        t:raw?Object.assign({},raw,ITG[seg][m]):null,wa:wAct(y,m),wp:wPlan(y,m)};})
      .filter(r=>r.o.out>0||r.t);
    if(!rows.length)return "";
    const line=r=>cols.map((c,i)=>{const k=c[0],isR=k==="rate";
      const f=v=>c[2]==="pct"?fPct(v):c[2]==="mil1"?fMil1(v):fInt(v);
      const av=isR?mv(r.o,"rate"):r.o[k], tv=r.t?(isR?(r.t.out?r.t.won/r.t.out:0):r.t[k]):null;
      return `<td class="${i===0?'gsep':''} tnum tgt">${tv==null?dash():f(tv)}</td><td class="tnum sum">${f(av)}</td>`
        +(isR?"":(r.t?achCell(r.o[k],r.t[k]):`<td>${dash()}</td>`));}).join("");
    const tot={o:sW(rows.map(r=>r.o)),t:rows.reduce((a,r)=>r.t?{out:(a?a.out:0)+r.t.out,won:(a?a.won:0)+r.t.won,new:(a?a.new:0)+r.t.new,f_tot:(a?a.f_tot:0)+r.t.f_tot}:a,null)};
    if(tot.t)tot.t.rate=tot.t.out?tot.t.won/tot.t.out:0;
    let h1=`<th class="ent" rowspan="2">월</th><th rowspan="2">주차</th>`,h2="";
    cols.forEach(c=>{const isR=c[0]==="rate";h1+=`<th class="grp gsep" colspan="${isR?2:3}">${c[1]}</th>`;
      h2+=`<th class="gsep">목표</th><th>실적</th>`+(isR?"":`<th>달성</th>`);});
    const b=rows.map(r=>`<tr><td class="ent">${r.m}</td><td class="tnum">${r.wa}/${r.wp}</td>${line(r)}</tr>`).join("");
    const t=`<tr class="grand"><td class="ent">합계</td><td class="tnum">${sumAct(y,rows.map(r=>r.m))}/${sumPlan(y,rows.map(r=>r.m))}</td>${line(tot)}</tr>`;
    return `<p class="subttl" style="margin-top:14px">${title}</p><div class="card"><div class="tbl-wrap"><table class="xtab"><thead><tr>${h1}</tr><tr>${h2}</tr></thead><tbody>${b}${t}</tbody></table></div></div>`;};
  const totAll=sW(ms.map(m=>sW(mgrAll(y,name)(m))));
  const tgAll=TGT(y,["mgr",name,"합계"],ms);
  const tgAllI=tgAll?Object.assign({},tgAll,{out:ms.reduce((a,m)=>a+(ITG["합계"][m].out||0),0),won:ms.reduce((a,m)=>a+(ITG["합계"][m].won||0),0),new:ms.reduce((a,m)=>a+(ITG["합계"][m].new||0),0)}):null;
  const firms=DET(y).firmM.filter(f=>f.mgr===name&&f.tot>0).sort((a,b)=>b.tot-a.tot);
  const firmList=firms.map(f=>`<tr class="clickrow" data-drill="firm" data-key="${encodeURIComponent(f.name)}"><td class="ent">${f.name}</td><td><span class="pill">${f.src==="대행"?"출품대행":"자사+유도"}</span></td><td class="tnum">${fInt(f.tot)}</td></tr>`).join("")||'<tr><td class="ent" colspan="3" style="color:var(--muted)">없음</td></tr>';
  const MR=(DET(y).mgrRev||{})[name]||{};
  const mms=MONTHS.filter(m=>MR[m]);
  const revTbl=mms.length?(()=>{const b=mms.map(m=>`<tr><td class="ent">${m}</td><td class="tnum">${fEok(MR[m].rev)}</td><td class="tnum">${fEok(MR[m].prof)}</td></tr>`).join("");
    const t2=mms.reduce((a,m)=>{a.rev+=MR[m].rev;a.prof+=MR[m].prof;return a;},{rev:0,prof:0});
    return `<p class="subttl" style="margin-top:14px">매출액 · 매출이익 (월별)</p><div class="card"><div class="tbl-wrap"><table class="xtab"><thead><tr><th class="ent">월</th><th>매출액</th><th>매출이익</th></tr></thead><tbody>${b}<tr class="grand"><td class="ent">합계</td><td class="tnum">${fEok(t2.rev)}</td><td class="tnum">${fEok(t2.prof)}</td></tr></tbody></table></div></div>`;})():"";
  $("#drillView").innerHTML=`<button class="backbtn" id="backBtn">← 목록</button>
    <div class="drill-head"><h2>${name} <span style="font-size:13px;color:var(--muted);font-weight:600">담당자</span></h2>
      <div class="drill-meta"><span>출품전문점 <b>${cnt.전문점}</b>개</span><span>출품사 <b>${cnt.출품사}</b>개</span>
      <span>출품 <b>${fInt(totAll.out)}</b>${tgAllI?` / 목표 ${fInt(tgAllI.out)} (${achTxt(totAll.out,tgAllI.out)})`:''}</span>
      <span>낙찰 <b>${fInt(totAll.won)}</b> (${fPct(mv(totAll,"rate"))})</span>
      <span>수수료 <b>${fEok(totAll.f_tot)}</b>${tgAll?` / 목표 ${fEok(tgAll.f_tot)} (${achTxt(totAll.f_tot,tgAll.f_tot)})`:''}</span></div></div>
    <div class="card card-pad" style="margin-bottom:14px"><p class="subttl">월별 출품 — 목표 vs 실적 (${y})</p>
      <div class="lgd"><span><i style="background:var(--t-tgt-fill);border:1.5px solid var(--t-tgt)"></i>목표</span><span><i style="background:var(--t-act)"></i>실적</span><span><i class="ln" style="background:var(--t-line)"></i>추이</span><span style="color:var(--muted)">막대 위 % = 달성률</span></div>
      <div class="chart-box" style="height:260px"><canvas id="drillChart"></canvas></div></div>
    ${segTable("합계 (전문점 + 출품사)","합계")}
    ${segTable("출품전문점","전문점")}
    ${segTable("출품사(경공매)","출품사")}
    ${revTbl}
    <p class="subttl" style="margin-top:14px">담당 출품전문점 (${firms.length}) — 행 클릭 시 상세</p>
    <div class="card"><div class="tbl-wrap"><table class="xtab"><thead><tr><th class="ent">업체명</th><th>구분</th><th>연 출품</th></tr></thead><tbody>${firmList}</tbody></table></div></div>`;
  $("#backBtn").onclick=closeDrill; bindDrill();
  try{const act=ms.map(m=>sW(mgrAll(y,name)(m)).out);
    const tgt=hasTG(y)?ms.map(m=>{const v=ITG["합계"][m];return v&&v.out!=null?v.out:null;}):null;
    drawDrillChart(act,tgt,ms);}catch(e){console.error(e);}
}
function drillFirm(name){
  const y=YEAR, fm=DET(y).firmM.find(f=>f.name===name); if(!fm){$("#drillView").innerHTML="";return;}
  const NW=DET(y).nweeks||{};
  const ms=MONTHS.filter(m=>(NW[m]||0)>0||(fm.months[m]&&fm.months[m].out>0));
  const MO=m=>(fm.months[m]&&fm.months[m].out>0)?fm.months[m]:eW();
  const tot=sW(ms.map(MO));
  const cols=[["out","출품","int"],["new","신규","int"],["won","낙찰","int"],["rate","낙찰률","pct"],["bid","낙찰가","eok"],["f_tot","수수료","mil1"],["pwb","대당낙찰가","won"],["pwf","대당수수료","won"]];
  const hasRevData=!!DET(y).firmRev;
  const FR=(DET(y).firmRev||{})[nrm(name)]||{};
  const rvc=x=>(x==null)?`<td class="tnum">${dash()}</td>`:`<td class="tnum">${fEok(x)}</td>`;
  const rows=ms.map(m=>{const o=MO(m),wk=NW[m]||1;const R=FR[m]||(hasRevData?{rev:0,prof:0,inc:0}:null);
    return `<tr><td class="ent">${m} <span style="color:var(--muted)">/${wk}주</span></td>${cols.map(c=>`<td class="tnum">${fmtG(mv(o,c[0]),c[2])}</td>`).join("")}${rvc(R&&R.rev)}${rvc(R&&R.prof)}${rvc(R&&R.inc)}</tr>`;}).join("");
  const rvT=ms.reduce((a,m)=>{const R=FR[m];if(R){a.rev+=R.rev;a.prof+=R.prof;a.inc+=R.inc;}return a;},{rev:0,prof:0,inc:0});
  const hasR=hasRevData;
  const totRow=`<tr class="grand"><td class="ent">합계</td>${cols.map(c=>`<td class="tnum">${fmtG(mv(tot,c[0]),c[2])}</td>`).join("")}${hasR?`<td class="tnum">${fEok(rvT.rev)}</td><td class="tnum">${fEok(rvT.prof)}</td><td class="tnum">${fEok(rvT.inc)}</td>`:`<td>${dash()}</td><td>${dash()}</td><td>${dash()}</td>`}</tr>`;
  $("#drillView").innerHTML=`<button class="backbtn" id="backBtn">← 목록</button>
    <div class="drill-head"><h2>${name}</h2><span class="badge2">${fm.src==="대행"?"출품대행":"자사+유도"}</span>
      <div class="drill-meta"><span>담당자 <b>${fm.mgr||"-"}</b></span><span>총 출품 <b>${fInt(tot.out)}</b></span><span>낙찰 <b>${fInt(tot.won)}</b> (${fPct(mv(tot,"rate"))})</span><span>수수료 <b>${fEok(tot.f_tot)}</b></span></div></div>
    <div class="card card-pad" style="margin-bottom:14px"><p class="subttl">월별 출품 (${y})</p><div class="chart-box" style="height:250px"><canvas id="drillChart"></canvas></div></div>
    <div class="card"><div class="tbl-wrap"><table class="xtab"><thead><tr><th class="ent">월</th>${cols.map(c=>`<th>${c[1]}</th>`).join("")}<th>매출액</th><th>매출이익</th><th>인센</th></tr></thead><tbody>${rows}${totRow}</tbody></table></div></div>
    <p class="hint">업체별 목표는 운영하지 않습니다(담당자·팀 단위만). 매출액·매출이익·인센 = 월별 공급가.</p>`;
  $("#backBtn").onclick=closeDrill;
  try{drawDrillChart(ms.map(m=>MO(m).out),null,ms);}catch(e){}
}

/* ---------- orchestrate ---------- */
function renderHome(){renderKPI();renderPerf();renderSrc();renderTrendChips();try{renderTrend();}catch(e){console.error(e);}}
function renderAll(){
  if(TAB==="home")renderHome();
  else if(TAB==="analysis")renderDetail();
  else if(TAB==="stock")renderStock();
  else if(TAB==="shops")renderShops();
}

$("#yearSeg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  YEAR=b.dataset.year;$$("#yearSeg button").forEach(x=>x.setAttribute("aria-pressed",x===b));MON="all";renderAll();});
const TABS=["home","analysis","weekly","stock","shops"];
$$(".tabs button").forEach(b=>b.onclick=()=>{TAB=b.dataset.tab;
  if(TAB==="stock")resetStockFilter();
  if(TAB==="shops")resetShopFilter();
  $$(".tabs button").forEach(x=>x.setAttribute("aria-pressed",x===b));
  TABS.forEach(t=>{const el=$("#tab-"+t); if(el)el.hidden=(TAB!==t);});
  renderAll();});
$("#stockSearch")&&$("#stockSearch").addEventListener("input",e=>{stockQ=e.target.value.trim().toLowerCase();stockFirm="";renderStock();});
$("#stockFirmSel")&&$("#stockFirmSel").addEventListener("change",e=>{stockFirm=e.target.value;stockQ="";$("#stockSearch").value="";renderStock();});
$("#stockMgrSel")&&$("#stockMgrSel").addEventListener("change",e=>{stockMgr=e.target.value;stockFirm="";renderStock();});
$("#stockReset")&&$("#stockReset").addEventListener("click",()=>{stockQ="";stockFirm="";stockMgr="";$("#stockSearch").value="";renderStock();});
$("#shopSearch").addEventListener("input",e=>{shopQ=e.target.value.trim().toLowerCase();shopFirm="";renderShops();});
$("#shopMgrSearch").addEventListener("input",e=>{shopMgrQ=e.target.value.trim().toLowerCase();shopMgr="";renderShops();});
$("#shopMgrSel").addEventListener("change",e=>{shopMgr=e.target.value;shopMgrQ="";$("#shopMgrSearch").value="";shopFirm="";renderShops();});
$("#shopFirmSel").addEventListener("change",e=>{shopFirm=e.target.value;shopQ="";$("#shopSearch").value="";renderShops();});
$("#shopReset").addEventListener("click",()=>{resetShopFilter();renderShops();});
$("#shopLockForm").addEventListener("submit",async e=>{e.preventDefault();
  const pw=$("#shopPw").value.trim(); if(!pw)return; $("#shopPwErr").textContent="확인 중…";
  try{SHOPS=await unlockShops(pw); resetShopFilter(); renderShops();}
  catch(err){$("#shopPwErr").textContent=(err&&err.message==="no crypto")?"이 브라우저에서는 열 수 없어요":"비밀번호가 맞지 않아요"; $("#shopPw").select();}});
$("#trendChips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;
  TRENDM=b.dataset.m;$$("#trendChips .chip").forEach(x=>x.setAttribute("aria-pressed",x===b));renderTrend();});
$("#modeSeg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  SUMMODE=b.dataset.mode;$$("#modeSeg button").forEach(x=>x.setAttribute("aria-pressed",x===b));renderPerf();renderSrc();});
$("#dimSeg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  DIM=b.dataset.dim;$$("#dimSeg button").forEach(x=>x.setAttribute("aria-pressed",x===b));renderDetail();});
$("#viewSeg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  MVIEW=b.dataset.view;$$("#viewSeg button").forEach(x=>x.setAttribute("aria-pressed",x===b));renderDetail();});
$("#periodBar").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  MON=b.dataset.p;$$("#periodBar button").forEach(x=>x.setAttribute("aria-pressed",x===b));renderDetail();});
$("#firmSearch").addEventListener("input",e=>{firmQ=e.target.value.trim().toLowerCase();if(DIM==="firm")renderFirmTable();});
$("#themeBtn").onclick=()=>{const r=document.documentElement;
  const cur=r.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
  r.setAttribute("data-theme",cur==="dark"?"light":"dark");
  setTimeout(()=>{if(TAB==="home")renderTrend();else if($("#drillView").hidden)renderDetail();},30);};

renderAll();
})();

</script>

</body></html>
